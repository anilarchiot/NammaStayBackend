# Supabase CLI settings for NammaStay.
# The server functions check their own secret header (not a staff login),
# so JWT verification is turned off for them.
project_id = "nammastay"

[functions.notify-booking]
verify_jwt = false

[functions.notify-lead]
verify_jwt = false

[functions.purge-id-docs]
verify_jwt = false

[functions.ical]
verify_jwt = false

[functions.ota-sync]
verify_jwt = false

[functions.razorpay]
verify_jwt = false

[functions.billing-reminders]
verify_jwt = false

[functions.channex]
verify_jwt = false
