# Deploy all Supabase Edge Functions when their source or config changes.
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#   SUPABASE_ACCESS_TOKEN  → supabase.com → Account → Access Tokens → Generate new token
#   SUPABASE_PROJECT_ID    → your project ref (the "xxxx" in https://xxxx.supabase.co)
#
# The database (SQL) is NOT deployed automatically on purpose: run new
# migration files yourself in Supabase → SQL Editor after testing them.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
    inputs:
      function:
        description: Deploy all functions or only the Beds24 connector
        required: true
        type: choice
        options: [all, connect]
        default: all

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DEPLOY_FUNCTION: ${{ inputs.function || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          if [ "$DEPLOY_FUNCTION" = "connect" ]; then
            supabase functions deploy connect --project-ref "$PROJECT_ID" --no-verify-jwt
          else
            for fn in notify-booking notify-lead purge-id-docs ical ota-sync razorpay billing-reminders channex api connect; do
              supabase functions deploy "$fn" --project-ref "$PROJECT_ID" --no-verify-jwt
            done
          fi
